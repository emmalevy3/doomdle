[package]
name = "doomdle"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# The WebAssembly exports in `src/wasm.rs`; native builds and tests don't need it.
wasm = ["dep:wasm-bindgen"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wasm-bindgen = { version = "0.2", optional = true }
